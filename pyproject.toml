[project]
name = "citation-mcp"
version = "0.2.1"
description = "Self-hosted Model Context Protocol server for citation verification, integrity, and discovery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ankit Sarin", email = "asarin@ucdavis.edu" }]
dependencies = [
    "mcp[cli]>=1.23.0",
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "aiosqlite>=0.20",
    "python-dateutil>=2.8",
    "pyjwt>=2.10",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
citation-mcp = "citation_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citation_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
